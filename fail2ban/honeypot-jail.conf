# Drosera jail.
#
# bootstrap.sh copies this to /etc/fail2ban/jail.d/honeypot.conf and rewrites
# logpath to match the checkout location.
#
# maxretry = 1 is deliberate: the honeypot has already done the scoring. A line
# in this file means an IP crossed the ban threshold, so fail2ban's only job is
# to push that decision into the firewall -- not to re-derive it.

[honeypot]
enabled  = true
filter   = honeypot
logpath  = /opt/drosera/storage/evidence/fail2ban.log
backend  = polling

maxretry = 1
findtime = 3600
bantime  = 604800

action   = ufw-honeypot

# Never ban yourself. Add your admin address here as well as in ufw.
#
# The Docker ranges are not politeness, they are a safety interlock. The action
# below is `ufw insert 1 deny from <ip>`, and the bridge gateway (172.25.0.1
# and friends) is how the host reaches every container -- so a ban on one of
# these would firewall the appliance away from itself. The honeypot already
# refuses to score these addresses; this is the second lock on the same door,
# because the failure mode is losing the whole stack rather than one service.
ignoreip = 127.0.0.1/8 ::1 172.25.0.0/16 172.26.0.0/16 172.27.0.0/16 172.28.0.0/16
