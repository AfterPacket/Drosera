# Drosera jail.
#
# bootstrap.sh copies this to /etc/fail2ban/jail.d/honeypot.conf and rewrites
# logpath to match the checkout location.
#
# maxretry = 1 is deliberate: the honeypot has already done the scoring. A line
# in this file means an IP crossed the ban threshold, so fail2ban's only job is
# to push that decision into the firewall -- not to re-derive it.

[honeypot]
enabled  = true
filter   = honeypot
logpath  = /opt/drosera/storage/evidence/fail2ban.log
backend  = polling

maxretry = 1
findtime = 3600
bantime  = 604800

action   = ufw-honeypot

# Never ban yourself. Add your admin address here as well as in ufw.
ignoreip = 127.0.0.1/8 ::1
