# Matches the ban lines Drosera writes to storage/evidence/fail2ban.log.
#
# Format emitted by the honeypot:
#   [2024-01-15 03:12:44] HONEYPOT_BAN ip=203.0.113.42 score=37 reason=SQLI_OOB tool=sqlmap services=web,ssh
#
# Test with:
#   fail2ban-regex /path/to/storage/evidence/fail2ban.log /etc/fail2ban/filter.d/honeypot.conf

[Definition]

failregex = ^\[[^\]]+\] HONEYPOT_BAN ip=<HOST>\s

ignoreregex =

# The timestamp is inside the line we match, and it is UTC.
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
