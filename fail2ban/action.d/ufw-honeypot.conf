# Ban an address across every honeypot port at once.
#
# A single blanket deny is used rather than per-port rules: once an IP has
# earned a ban it has no business reaching any service on this box, and one
# rule keeps the ufw table small under sustained scanning.
#
# `insert 1` puts the deny ahead of the allow rules bootstrap.sh created.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban   = ufw insert 1 deny from <ip> to any comment "drosera <name>"
actionunban = ufw delete deny from <ip> to any

[Init]

name = honeypot
