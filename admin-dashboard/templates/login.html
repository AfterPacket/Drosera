<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Drosera</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:,">
</head>
<body>
<form class="auth" method="post" action="{{ url_for('login') }}">
  <h1>Drosera</h1>
  <p class="sub">Step 1 of 2 &mdash; password</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username"
         autocapitalize="off" autocorrect="off" required autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password"
         autocomplete="current-password" required>
  <button type="submit">Continue</button>
</form>
<footer class="credits">
  Drosera &middot; Created by
  <a href="https://digitalsystems.cc" target="_blank" rel="noopener noreferrer">Digital Systems LLC</a>
  /
  <a href="https://github.com/afterpacket" target="_blank" rel="noopener noreferrer">Afterpacket</a>
</footer>
</body>
</html>
