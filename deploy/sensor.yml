# Sensor mode: ship this deployment's events to a central Elasticsearch.
#
# Overlay on the main compose file. Only changes one thing -- it gives
# elastic-shipper a network with egress, because `elastic-internal` is
# `internal: true` and a sensor has to reach a cluster on another host.
#
#   docker compose -f docker-compose.yml -f deploy/sensor.yml \
#       --profile elastic up -d --no-deps elastic-shipper
#
# `--no-deps` matters: elastic-shipper depends on the local elasticsearch, and
# without it Compose starts a cluster this host does not need.
#
# In .env on the sensor:
#
#   DROSERA_INSTANCE=vps-fra-01           # names this sensor in every document
#   ELASTIC_URL=https://es.example.net:9200
#   ELASTIC_USERNAME=sensor_fra01         # NOT `elastic`
#   ELASTIC_PASSWORD=<that sensor's own password>
#
# Give each sensor its own append-only account rather than sharing the hive's
# `elastic` superuser -- otherwise one compromised sensor can delete the whole
# fleet's evidence. The role and per-sensor users are created on the hive; see
# "Give each sensor its own account first" in the README.
#
# What this does NOT do, and you should decide deliberately:
#
#   * It gives the shipper a route off this box. It reads events off the
#     storage volume and is on no honeypot network, so nothing an attacker
#     touches gains a path out -- but the container itself now has one.
#   * It does not add TLS. Elasticsearch basic auth over plain http puts the
#     cluster password on the wire, and that password is the whole fleet's
#     record. Use https, or carry it over a private network (WireGuard,
#     Tailscale) and point ELASTIC_URL at the private address.
#   * It does not publish anything on the hive. Elasticsearch there is
#     unpublished by default -- reachable only from its own Docker network --
#     so the hive needs its own decision about how sensors reach it.

services:
  elastic-shipper:
    networks: [elastic-internal, shipper-egress]

networks:
  shipper-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-shipper
