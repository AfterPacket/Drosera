# Drosera honeypot appliance.
#
# CONTAINMENT MODEL
#   - admin-internal and elastic-internal are `internal: true`: no container on
#     them can reach the internet, and nothing else needs to reach them.
#   - honeypot-internal is NOT internal, despite being the network that most
#     needs to be. Docker installs no DNAT for published ports on an internal
#     network, so every `ports:` entry would silently stop working. Egress from
#     it is blocked at the host firewall instead, by DOCKER-USER rules that
#     bootstrap.sh installs; deploy/smoke-test.sh asserts that ssh-honey cannot
#     reach 1.1.1.1. The full reasoning is on the network itself, below.
#   - Two networks have egress, and neither has a honeypot container on it.
#     cam-egress carries session-cam, intel and certbot; llm-egress carries
#     llm-broker and, under its profile, ollama. Members of both listen on
#     nothing reachable from the honeypot side: work arrives over the storage
#     volume, never a socket, so a clip can be delivered and a model can be
#     asked without anything an attacker touches gaining a path out.
#   - What those containers open matters as much as what they can reach. intel
#     reads the JSON sidecars and the hash in the filename, never the captured
#     bytes. llm-broker is the exception and is documented as one: attacker
#     command text is its input, which is why it carries no third-party Python
#     and why a cloud provider needs a second switch to enable.
#   - Every container: non-root (UID 1000), read-only root filesystem, all
#     capabilities dropped, no-new-privileges, pids and memory capped.
#   - Services bind unprivileged ports inside the container; the host maps the
#     real port onto them, so nothing needs CAP_NET_BIND_SERVICE.
#   - Container logs are size-capped so a scan flood cannot fill the disk.
#
# Enabling webhook/Telegram/syslog alerting requires egress. See
# deploy/README.md -- do it deliberately, not by default.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-honeypot-env: &honeypot-env
  REDIS_HOST: redis-honeypot
  REDIS_PORT: "6379"
  STORAGE_DIR: /var/honeypot/storage
  HONEYPOT_BAN_THRESHOLD: ${HONEYPOT_BAN_THRESHOLD:-35}
  HONEYPOT_TARPIT_THRESHOLD: ${HONEYPOT_TARPIT_THRESHOLD:-5}
  HONEYPOT_TARPIT_RELEASE_SECONDS: ${HONEYPOT_TARPIT_RELEASE_SECONDS:-3600}
  # Crash mode: malformed responses, sent before the handshake. Understand the
  # trade before raising the threshold -- an address in crash mode stops giving
  # up credentials, transcripts and payloads, because it never gets far enough
  # to offer any. Between the tarpit (5) and the ban (35) by default, so it
  # applies to addresses already well past ordinary noise. Set HONEYPOT_CRASH=0
  # to keep them talking instead; that also releases anyone already flagged.
  HONEYPOT_CRASH: ${HONEYPOT_CRASH:-1}
  HONEYPOT_CRASH_THRESHOLD: ${HONEYPOT_CRASH_THRESHOLD:-15}
  HONEYPOT_CRASH_GARBAGE_MIN: ${HONEYPOT_CRASH_GARBAGE_MIN:-512}
  HONEYPOT_CRASH_GARBAGE_MAX: ${HONEYPOT_CRASH_GARBAGE_MAX:-8192}
  # The exit bang: how long a recorded session is held after its ending is
  # corrupted. Governed by HONEYPOT_CRASH but not by the threshold -- it runs
  # after collection, so it applies to every session that reached a shell.
  HONEYPOT_CRASH_HOLD_SECONDS: ${HONEYPOT_CRASH_HOLD_SECONDS:-60}
  HONEYPOT_BAN_TTL: ${HONEYPOT_BAN_TTL:-604800}
  HONEYPOT_MAX_STORAGE_MB: ${HONEYPOT_MAX_STORAGE_MB:-4096}
  # Comma-separated. Your own address belongs here, or browsing your own site
  # tarpits you, eventually bans you, and pollutes the statistics.
  HONEYPOT_IGNORE_IPS: ${HONEYPOT_IGNORE_IPS:-}
  HONEYPOT_IGNORE_GATEWAY: ${HONEYPOT_IGNORE_GATEWAY:-1}
  HONEYPOT_ACCEPT_ANY_PASSWORD: ${HONEYPOT_ACCEPT_ANY_PASSWORD:-0}
  HONEYPOT_ACCEPT_WORDLIST: ${HONEYPOT_ACCEPT_WORDLIST:-}
  # Published defaults, so they are a fingerprint like any other -- change them
  # per deployment for the same reason the persona exists.
  FAKE_BUSYBOX_VERSION: "${FAKE_BUSYBOX_VERSION:-1.30.1}"
  # Quoted: the value contains spaces, and an unquoted substitution leaves YAML
  # to interpret the result rather than the string it was meant to be.
  FAKE_BUSYBOX_BUILD: "${FAKE_BUSYBOX_BUILD:-2019-10-28 12:23:11 UTC}"
  # `nmap` in either fake shell reports on the attacker's own address. Set to 0
  # to keep them talking instead -- see .env.example for the trade-off.
  HONEYPOT_SCANBACK: ${HONEYPOT_SCANBACK:-1}
  # A banned address gets shared/rickroll.txt, dripped, on every tier -- the
  # website keeps the 302 only for clients that ask for HTML. Set to 0 to drop
  # the connection silently instead. Read by the web container too, which
  # inherits this anchor.
  HONEYPOT_RICKROLL: ${HONEYPOT_RICKROLL:-1}
  HONEYPOT_RICKROLL_DRIP_SECONDS: ${HONEYPOT_RICKROLL_DRIP_SECONDS:-120}
  HONEYPOT_RICKROLL_RECORD_INTERVAL: ${HONEYPOT_RICKROLL_RECORD_INTERVAL:-3600}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
  ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
  ALERT_SYSLOG_HOST: ${ALERT_SYSLOG_HOST:-}
  ALERT_SYSLOG_PORT: ${ALERT_SYSLOG_PORT:-514}
  # Read by shared/tarpit.py in the asyncio services.
  TARPIT_BYTE_DELAY: ${TARPIT_BYTE_DELAY:-1.5}
  TARPIT_MAX_BYTE_GAP: ${TARPIT_MAX_BYTE_GAP:-10}
  TARPIT_STALL_MIN: ${TARPIT_STALL_MIN:-2}
  TARPIT_STALL_MAX: ${TARPIT_STALL_MAX:-6}
  HONEYPOT_PAYLOAD_CHARS: ${HONEYPOT_PAYLOAD_CHARS:-500}
  # Optional LLM answers for commands the fake shell does not implement. Off
  # unless this is 1 AND the llm profile is up -- with the flag on and no
  # broker running, nothing ever writes a reply and the shell falls back to
  # `command not found` on its own. These containers still have no egress; the
  # request crosses to llm-broker on the storage volume. See shared/llm.py.
  HONEYPOT_LLM: ${HONEYPOT_LLM:-0}
  HONEYPOT_LLM_TIMEOUT: ${HONEYPOT_LLM_TIMEOUT:-6}
  HONEYPOT_LLM_ENGAGED_TIMEOUT: ${HONEYPOT_LLM_ENGAGED_TIMEOUT:-20}
  HONEYPOT_LLM_MAX_PENDING: ${HONEYPOT_LLM_MAX_PENDING:-32}
  HONEYPOT_LLM_MAX_CHARS: ${HONEYPOT_LLM_MAX_CHARS:-2000}

# Flattened rather than merging *hardening in: nested YAML merge keys inside an
# anchor that is itself merged are handled inconsistently across parsers.
x-python-service: &python-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    redis-honeypot:
      condition: service_healthy
  volumes:
    - ./shared:/app/shared:ro
    - ./storage:/var/honeypot/storage
    # This deployment's persona -- the machine it pretends to be. Generated,
    # gitignored, read-only here.
    - ./persona:/persona:ro
  tmpfs:
    # noexec,nosuid,nodev: with a read-only rootfs, /tmp is the only writable
    # path in the container. Leaving it executable would hand an attacker who
    # achieved code execution the one place to stage a binary or a local
    # privilege-escalation exploit.
    - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
  networks: [honeypot-internal]
  mem_limit: 256m
  pids_limit: 256
  cpus: 0.50
  # Only nofile here. RLIMIT_NPROC is counted per host UID, and every container
  # runs as UID 1000, so an nproc ulimit would be shared across all of them.
  # Per-container process capping is pids_limit above, which is cgroup-based.
  ulimits:
    nofile: { soft: 4096, hard: 8192 }

services:

  # ---------------------------------------------------------------- datastores

  redis-honeypot:
    image: redis:7-alpine
    container_name: hp-redis-honeypot
    # Bounded memory with LRU eviction: an attacker generating millions of
    # identities can never OOM the host.
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
    user: "999:1000"
    volumes:
      - redis-honeypot-data:/data
    networks: [honeypot-internal]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-admin:
    image: redis:7-alpine
    container_name: hp-redis-admin
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    user: "999:1000"
    volumes:
      - redis-admin-data:/data
    networks: [admin-internal]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 192m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------- web frontend

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    container_name: hp-web
    <<: *hardening
    depends_on:
      redis-honeypot:
        condition: service_healthy
    environment:
      <<: *honeypot-env
      STORAGE_PATH: /var/honeypot/storage
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      TARPIT_MAX_CONCURRENT: ${TARPIT_MAX_CONCURRENT:-24}
      TARPIT_MAX_SECONDS: ${TARPIT_MAX_SECONDS:-900}
      CAM_WEB_IDLE_SECONDS: ${CAM_WEB_IDLE_SECONDS:-900}
      CAM_RECORD_WEB_PROBES: ${CAM_RECORD_WEB_PROBES:-true}
      RICKROLL_URL: ${RICKROLL_URL:-https://www.youtube.com/watch?v=dQw4w9WgXcQ}
      RICKROLL_FILE: /rickroll.txt
      SERVER_NAME: ${DOMAIN:-localhost}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./web:/var/www/html:ro
      - ./nginx/honeypot.conf:/etc/nginx/conf.d/honeypot.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./storage:/var/honeypot/storage
      # Same persona the Python honeypots read, so the website and the fake
      # shell agree about what machine this is.
      - ./persona:/persona:ro
      # One file out of shared/, not the directory: this container gets ./web
      # and nothing else of ours, and that is worth keeping. Without this mount
      # sb_rickroll() cannot find the art and quietly falls back to the 302 --
      # deploy/preflight.sh asserts the mount for that reason.
      #
      # Mounted at the root, NOT under /var/www/html. That path is itself a
      # read-only bind mount, and Docker cannot create a mountpoint inside one:
      # the container fails to start with "make mountpoint: read-only file
      # system". A top-level path is on the container's own rootfs, where the
      # mountpoint can still be created -- the same reason /persona works.
      - ./shared/rickroll.txt:/rickroll.txt:ro
    tmpfs:
      # nginx and php-fpm scratch space. noexec matters most here: this is the
      # internet-facing container and the only writable path it has.
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      # mode=1777 is not optional: without it the tmpfs mounts root-owned 0755
      # and php-fpm, running as UID 1000, cannot create its runtime directory.
      - /run:size=8m,mode=1777,noexec,nosuid,nodev
    # NOT on admin-internal: the internet-facing container must never be able to
    # reach redis-admin or the dashboard.
    networks: [honeypot-internal]
    mem_limit: 512m
    pids_limit: 512
    cpus: 1.5

  # --------------------------------------------------------- protocol honeypots

  ssh-honey:
    build: { context: ./ssh-honey, dockerfile: Dockerfile }
    container_name: hp-ssh-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "2222"
      SSH_HOST_KEY: /app/state/ssh_host_key
      SSH_MAX_CONNECTIONS: ${SSH_MAX_CONNECTIONS:-200}
      SSH_TARPIT_MAX_SECONDS: ${SSH_TARPIT_MAX_SECONDS:-1800}
      SSH_TARPIT_LINE_MIN: ${SSH_TARPIT_LINE_MIN:-1.5}
      SSH_TARPIT_LINE_MAX: ${SSH_TARPIT_LINE_MAX:-4.0}
      SSH_TARPIT_PER_IP: ${SSH_TARPIT_PER_IP:-8}
    ports:
      - "22:2222"
    volumes:
      - ./shared:/app/shared:ro
      - ./storage:/var/honeypot/storage
      - ./persona:/persona:ro
      # Persisted so the host key fingerprint stays stable across restarts --
      # a changing fingerprint is an obvious tell.
      - ssh-host-key:/app/state
    mem_limit: 384m
    pids_limit: 512

  ftp-honey:
    build: { context: ./ftp-honey, dockerfile: Dockerfile }
    container_name: hp-ftp-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "2121"
      FTP_PASV_MIN: "30000"
      FTP_PASV_MAX: "30019"
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-}
      FTP_TARPIT_MAX_SECONDS: ${FTP_TARPIT_MAX_SECONDS:-600}
    ports:
      - "21:2121"
      - "30000-30019:30000-30019"

  telnet-honey:
    build: { context: ./telnet-honey, dockerfile: Dockerfile }
    container_name: hp-telnet-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "2323"
    ports:
      - "23:2323"

  smtp-honey:
    build: { context: ./smtp-honey, dockerfile: Dockerfile }
    container_name: hp-smtp-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "2525"
      SMTP_TARPIT_MAX_SECONDS: ${SMTP_TARPIT_MAX_SECONDS:-600}
    ports:
      - "25:2525"

  mysql-honey:
    build: { context: ./mysql-honey, dockerfile: Dockerfile }
    container_name: hp-mysql-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "33306"
      MYSQL_MAX_PACKET: ${MYSQL_MAX_PACKET:-1048576}
      MYSQL_TARPIT_MAX_SECONDS: ${MYSQL_TARPIT_MAX_SECONDS:-600}
    ports:
      - "3306:33306"

  smb-honey:
    build: { context: ./smb-honey, dockerfile: Dockerfile }
    container_name: hp-smb-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT_SMB: "4445"
      LISTEN_PORT_NBT: "4139"
      SMB_TARPIT_MAX_SECONDS: ${SMB_TARPIT_MAX_SECONDS:-600}
      SMB_FAIL_ATTEMPTS: ${SMB_FAIL_ATTEMPTS:-0}
      SMB_ALLOW_SESSION: ${SMB_ALLOW_SESSION:-true}
      SMB_MAX_HANDLES: ${SMB_MAX_HANDLES:-512}
    ports:
      - "445:4445"
      - "139:4139"

  rdp-honey:
    build: { context: ./rdp-honey, dockerfile: Dockerfile }
    container_name: hp-rdp-honey
    <<: *python-service
    environment:
      <<: *honeypot-env
      LISTEN_PORT: "33389"
      RDP_TARPIT_MAX_SECONDS: ${RDP_TARPIT_MAX_SECONDS:-600}
    ports:
      - "3389:33389"

  # ------------------------------------------------------------ session camera

  # Renders finished attacker sessions to video and delivers them.
  #
  # This is the ONLY container with internet access, and it is deliberately not
  # on honeypot-internal. Recordings reach it through the storage bind mount --
  # a filesystem handoff, not a network one. That asymmetry is the whole point:
  # a compromised honeypot still has no route out through this container, and a
  # compromised camera still has no route into the honeypot network.
  session-cam:
    build: { context: ./session-cam, dockerfile: Dockerfile }
    container_name: hp-session-cam
    <<: *hardening
    environment:
      STORAGE_DIR: /var/honeypot/storage
      CAM_ENABLED: ${CAM_ENABLED:-true}
      # mp4 by default: it is what makes full-session playback deliverable.
      # Falls back to a sampled GIF wherever ffmpeg is missing.
      CAM_FORMAT: ${CAM_FORMAT:-mp4}
      CAM_MIN_SCORE: ${CAM_MIN_SCORE:-5}
      CAM_MIN_DURATION: ${CAM_MIN_DURATION:-2}
      # Past this score the content/time floors no longer apply: a short, dense
      # bot session is exactly what those floors were wrongly discarding.
      CAM_ALWAYS_SCORE: ${CAM_ALWAYS_SCORE:-15}
      # Rickroll deliveries are recorded and exported, but not rendered to
      # video: a banned scanner reconnects hundreds of times a day and every
      # delivery is the same picture.
      CAM_SKIP_RICKROLL: ${CAM_SKIP_RICKROLL:-true}
      CAM_POLL_SECONDS: ${CAM_POLL_SECONDS:-15}
      CAM_RETENTION_DAYS: ${CAM_RETENTION_DAYS:-14}
      CAM_MAX_CLIP_MB: ${CAM_MAX_CLIP_MB:-45}
      CAM_MAX_CLIPS_TOTAL_MB: ${CAM_MAX_CLIPS_TOTAL_MB:-1024}
      # Full playback is not requested here -- cam.py asks for it per clip, when
      # it knows an ffmpeg step follows and the GIF is only an intermediate.
      # These two are the fallback and the cap for when the GIF is what actually
      # gets delivered. Setting CAM_MAX_FRAMES=0 is supported but pointless, and
      # breaks any container still running an older renderer.
      CAM_MAX_FRAMES: ${CAM_MAX_FRAMES:-420}
      CAM_GIF_SAFETY_FRAMES: ${CAM_GIF_SAFETY_FRAMES:-420}
      CAM_MIN_BYTES: ${CAM_MIN_BYTES:-700}
      # Live alerting. The honeypot containers have no egress, so this is the
      # only place an alert can actually leave the box.
      CAM_ALERT_EVENTS: ${CAM_ALERT_EVENTS:-}
      CAM_ALERT_DEDUPE_SECONDS: ${CAM_ALERT_DEDUPE_SECONDS:-900}
      CAM_ALERT_MAX_PER_HOUR: ${CAM_ALERT_MAX_PER_HOUR:-20}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      CAM_SMTP_HOST: ${CAM_SMTP_HOST:-}
      CAM_SMTP_PORT: ${CAM_SMTP_PORT:-587}
      CAM_SMTP_USER: ${CAM_SMTP_USER:-}
      CAM_SMTP_PASSWORD: ${CAM_SMTP_PASSWORD:-}
      CAM_SMTP_SECURITY: ${CAM_SMTP_SECURITY:-starttls}
      CAM_MAIL_FROM: ${CAM_MAIL_FROM:-}
      CAM_MAIL_TO: ${CAM_MAIL_TO:-}
    volumes:
      # Read-write: it writes clips into storage/clips and per-session markers
      # next to the recordings. It never opens a socket to the honeypot.
      - ./storage:/var/honeypot/storage
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks: [cam-egress]
    # Rendering holds a few hundred quantised frames in memory at once.
    mem_limit: 768m
    pids_limit: 128
    cpus: 1.0

  # --------------------------------------------------------- sample enrichment

  # Looks up quarantined payloads on VirusTotal by hash. Same asymmetry as
  # session-cam: it reads storage/loot over the filesystem and reaches the
  # internet, but the honeypots that filled it cannot, and nothing can reach
  # this. It sends a SHA-256 and nothing else -- see intel/vt.py for why
  # uploading the sample itself is a decision rather than a default.
  intel:
    build: { context: ./intel, dockerfile: Dockerfile }
    container_name: hp-intel
    <<: *hardening
    environment:
      LOOT_DIR: /var/honeypot/storage/loot
      STORAGE_DIR: /var/honeypot/storage
      IOC_DIR: /var/honeypot/storage/ioc
      # Where the dashboard leaves rescan markers. Already inside the storage
      # mount this container has read-write, so it needs no extra volume --
      # only the path, and it must agree with the dashboard's REQUEST_DIR.
      REQUEST_DIR: /var/honeypot/storage/requests
      # Second-stage payload retrieval. OFF unless explicitly enabled: this is
      # the one component that connects out to infrastructure an attacker
      # chose. It runs here because this container already has egress and the
      # honeypots have none -- they write IOCs to the volume, this reads them,
      # and the two share no network. See intel/fetcher.py for the failsafes
      # and AUTHORIZATION.md 2.1 before turning it on.
      FETCH_ENABLED: ${FETCH_ENABLED:-false}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-8388608}
      FETCH_MAX_PER_HOUR: ${FETCH_MAX_PER_HOUR:-20}
      FETCH_HOST_COOLDOWN: ${FETCH_HOST_COOLDOWN:-3600}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-8}
      FETCH_POLL_SECONDS: ${FETCH_POLL_SECONDS:-60}
      VT_API_KEY: ${VT_API_KEY:-}
      VT_POLL_SECONDS: ${VT_POLL_SECONDS:-300}
      VT_REQUEST_INTERVAL: ${VT_REQUEST_INTERVAL:-20}
      # 1, not 20. Multiplied by 86400/VT_POLL_SECONDS this is the daily
      # request count: 1 per 300s is 288/day against a free-tier allowance of
      # 500, where 20 was 5,760 and exhausted the key every morning.
      VT_MAX_PER_RUN: ${VT_MAX_PER_RUN:-1}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./shared:/app/shared:ro
      - ./storage:/var/honeypot/storage
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    networks: [cam-egress]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.25

  # ------------------------------------------------------------ TLS automation

  # Optional. Without it, drop a Cloudflare Origin Certificate into certs/ and
  # forget about it for 15 years -- that remains the lower-maintenance option.
  # This exists for running unproxied, or if you would rather not hand-place a
  # certificate at all.
  #
  #   docker compose --profile letsencrypt up -d
  #
  # On cam-egress because it must reach the ACME API and Cloudflare's DNS API.
  # It is on no other network: it hands the certificate to the web container
  # through the certs/ volume, never over a socket, so the internet-facing
  # container gains nothing from its egress.
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: hp-certbot
    restart: unless-stopped
    profiles: [letsencrypt]
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # Cloudflare API token scoped to Zone:DNS:Edit on this zone only.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-false}
      LETSENCRYPT_CHECK_INTERVAL: ${LETSENCRYPT_CHECK_INTERVAL:-43200}
      LETSENCRYPT_PROPAGATION_SECONDS: ${LETSENCRYPT_PROPAGATION_SECONDS:-30}
    entrypoint: ["/bin/sh", "/renew.sh"]
    volumes:
      - ./certbot/renew.sh:/renew.sh:ro
      - ./certs:/certs
      - letsencrypt-data:/etc/letsencrypt
    tmpfs:
      # The API token is written here as cloudflare.ini and never hits disk.
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    networks: [cam-egress]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # -------------------------------------------------------------- search stack

  # T-Pot-style analytics. Elasticsearch and Kibana sit on their own internal
  # network: the honeypot containers are not on it and cannot reach them, and
  # events arrive via the elastic-shipper reading the storage volume rather than
  # over any network path from the honeypot side.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: hp-elasticsearch
    restart: unless-stopped
    # Opt-in: this stack wants ~2.5GB of RAM, which is more than the whole
    # honeypot. Start it with `docker compose --profile elastic up -d`.
    profiles: [elastic]
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      xpack.security.enabled: "true"
      # Plain HTTP inside an internal-only Docker network. Enabling transport
      # TLS here would mean managing a CA for traffic that never leaves the
      # host's bridge; the boundary being relied on is the network, plus the
      # fact that Kibana is published to 127.0.0.1 only.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      # No egress on this network, so the GeoIP auto-updater would retry
      # forever. Mount a MaxMind DB for the shipper instead -- see .env.example.
      ingest.geoip.downloader.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms${ELASTIC_HEAP:-512m} -Xmx${ELASTIC_HEAP:-512m}
      bootstrap.memory_lock: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [elastic-internal]
    mem_limit: ${ELASTIC_MEM_LIMIT:-1536m}
    pids_limit: 512
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    healthcheck:
      test: ["CMD-SHELL",
             "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: hp-kibana
    restart: unless-stopped
    profiles: [elastic]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      # elastic-shipper sets this password on kibana_system at startup; Kibana
      # retries until it matches, so the ordering does not need enforcing.
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-}
      SERVER_PUBLICBASEURL: http://127.0.0.1:${KIBANA_PORT:-5601}
      TELEMETRY_ENABLED: "false"
      TELEMETRY_OPTIN: "false"
    ports:
      # Loopback only, same access model as the dashboard:
      #   ssh -N -L 5601:127.0.0.1:5601 -p 2222 you@vps
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    networks:
      - elastic-internal
      - kibana-access
    mem_limit: ${KIBANA_MEM_LIMIT:-1024m}
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  elastic-shipper:
    build: { context: ./elastic, dockerfile: Dockerfile }
    container_name: hp-elastic-shipper
    <<: *hardening
    profiles: [elastic]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      STORAGE_DIR: /var/honeypot/storage
      # Overridable so several deployments can ship into one Elasticsearch.
      # Doing that means giving this container egress, which the elastic
      # network deliberately does not have -- see "Several instances, one
      # Elasticsearch" in the README before changing it.
      ELASTIC_URL: ${ELASTIC_URL:-http://elasticsearch:9200}
      ELASTIC_USERNAME: ${ELASTIC_USERNAME:-elastic}
      # Names this deployment when its events land beside another's.
      DROSERA_INSTANCE: ${DROSERA_INSTANCE:-}
      # Empty rather than a compose-level hard requirement: interpolation runs
      # over the whole file regardless of profiles, so `:?` here would stop the
      # honeypot booting for anyone not using Elasticsearch. The shipper checks
      # for it at startup and exits with a clear message instead.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      KIBANA_URL: http://kibana:5601
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-}
      ELASTIC_INDEX_PREFIX: ${ELASTIC_INDEX_PREFIX:-drosera}
      ELASTIC_RETENTION_DAYS: ${ELASTIC_RETENTION_DAYS:-90}
      ELASTIC_POLL_SECONDS: ${ELASTIC_POLL_SECONDS:-15}
      GEOIP_DB: /geoip/GeoLite2-City.mmdb
      # Separate edition; absent is fine and simply yields no source.as.
      GEOIP_ASN_DB: /geoip/GeoLite2-ASN.mmdb
    volumes:
      # Read-write only because the offset checkpoint lives beside the logs.
      # It never writes into logs/ itself.
      - ./storage:/var/honeypot/storage
      - ./elastic/geoip:/geoip:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    # NOT on honeypot-internal: it reads events off the volume, so it needs no
    # path to the honeypot, and this keeps the search stack unreachable from it.
    networks: [elastic-internal]
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.50

  # ------------------------------------------------------- generated responses

  # The only container permitted to talk to a language model.
  #
  # It is on llm-egress and on no honeypot network, it listens on nothing, and
  # it accepts no connection. The fake shell reaches it by writing a file to the
  # storage volume, exactly as session-cam is reached -- because the container
  # that can call an API must not be reachable from the container an attacker is
  # typing into.
  #
  # Under a profile, so `docker compose up -d` without it leaves the appliance
  # exactly as it was. HONEYPOT_LLM=1 with this profile down is harmless: no
  # reply is ever written and every unknown command falls back on its timeout.
  llm-broker:
    build: { context: ./llm-broker, dockerfile: Dockerfile }
    container_name: hp-llm-broker
    profiles: [llm]
    <<: *hardening
    environment:
      STORAGE_DIR: /var/honeypot/storage
      HONEYPOT_LLM_PROVIDER: ${HONEYPOT_LLM_PROVIDER:-ollama}
      HONEYPOT_LLM_MODEL: ${HONEYPOT_LLM_MODEL:-}
      HONEYPOT_LLM_API_KEY: ${HONEYPOT_LLM_API_KEY:-}
      # Second switch, deliberately separate from HONEYPOT_LLM. Turning the
      # feature on and agreeing to send attacker command text and this
      # deployment's persona to a third party are different decisions, and the
      # broker refuses to start a cloud provider without this one.
      HONEYPOT_LLM_ALLOW_EGRESS: ${HONEYPOT_LLM_ALLOW_EGRESS:-0}
      HONEYPOT_LLM_OLLAMA_URL: ${HONEYPOT_LLM_OLLAMA_URL:-http://ollama:11434}
      HONEYPOT_LLM_MAX_CALLS_HOUR: ${HONEYPOT_LLM_MAX_CALLS_HOUR:-500}
      HONEYPOT_LLM_MAX_CALLS_IP_HOUR: ${HONEYPOT_LLM_MAX_CALLS_IP_HOUR:-60}
      HONEYPOT_LLM_MAX_TOKENS: ${HONEYPOT_LLM_MAX_TOKENS:-400}
      HONEYPOT_LLM_TEMPERATURE: ${HONEYPOT_LLM_TEMPERATURE:-0.4}
      HONEYPOT_LLM_MAX_CHARS: ${HONEYPOT_LLM_MAX_CHARS:-2000}
      HONEYPOT_LLM_MAX_LINES: ${HONEYPOT_LLM_MAX_LINES:-60}
      HONEYPOT_LLM_REQUEST_TIMEOUT: ${HONEYPOT_LLM_REQUEST_TIMEOUT:-15}
      HONEYPOT_LLM_MAX_AGE: ${HONEYPOT_LLM_MAX_AGE:-25}
    volumes:
      - ./storage:/var/honeypot/storage
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    networks: [llm-egress]
    mem_limit: 128m
    pids_limit: 64
    cpus: 0.25

  # Local model, so that the default configuration sends nothing anywhere.
  #
  # Its own profile: a deployment using a cloud provider does not want several
  # gigabytes of resident model, and one using Ollama does not want an API key.
  #
  #   docker compose --profile llm --profile ollama up -d
  #   docker compose exec ollama ollama pull llama3.2:3b
  #
  # Worth being clear about what this container is. Attacker command text
  # reaches it as prompt input, and it is on a network with egress because that
  # is how `ollama pull` fetches a model. It is therefore the least contained
  # thing here after session-cam: capabilities dropped and limits set, but a
  # writable rootfs, because it writes the models it downloads. It is on no
  # honeypot network, which is the property that actually matters.
  ollama:
    image: ollama/ollama:latest
    container_name: hp-ollama
    profiles: [ollama]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Unload after five minutes idle. A honeypot is quiet for hours at a
      # time and there is no reason to hold gigabytes resident through it.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama-models:/root/.ollama
    networks: [llm-egress]
    # A 3B model needs roughly 4GB resident. Raise this before raising the
    # model size, or the pull succeeds and every generation is OOM-killed.
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    pids_limit: 256

  # ------------------------------------------------------------ operator panel

  admin-dashboard:
    build: { context: ./admin-dashboard, dockerfile: Dockerfile }
    container_name: hp-admin-dashboard
    <<: *hardening
    depends_on:
      redis-admin:
        condition: service_healthy
    environment:
      REDIS_HOST: redis-admin
      REDIS_PORT: "6379"
      REDIS_HONEYPOT_HOST: redis-honeypot
      REDIS_HONEYPOT_PORT: "6379"
      STORAGE_DIR: /var/honeypot/storage
      REQUEST_DIR: /var/honeypot/requests
      # Password on the loot download. The convention among analysts is
      # "infected", and the point is not secrecy -- it stops desktop AV
      # unpacking the archive and quarantining a sample mid-download.
      LOOT_ZIP_PASSWORD: ${LOOT_ZIP_PASSWORD:-infected}
      LOOT_ZIP_MAX_MB: ${LOOT_ZIP_MAX_MB:-128}
      # Not VT_API_KEY. The loot page needs to know only *whether* scanning is
      # configured, and intel publishes that to storage/intel/status.json the
      # way llm-broker publishes its own -- the same reason the SMTP
      # credentials below are withheld. This container has no egress and could
      # not use the key, so holding it would be pure exposure.
      VT_POLL_SECONDS: ${VT_POLL_SECONDS:-300}
      ADMIN_CONFIG: /app/config/admin-config.json
      AUDIT_LOG: /app/admin-logs/audit.jsonl
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-28800}
      # Reached over an SSH tunnel as plain http on 127.0.0.1, so the Secure
      # cookie flag would prevent the cookie being stored. Set to true if you
      # front the dashboard with TLS.
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      HONEYPOT_BAN_THRESHOLD: ${HONEYPOT_BAN_THRESHOLD:-35}
      HONEYPOT_TARPIT_THRESHOLD: ${HONEYPOT_TARPIT_THRESHOLD:-5}
      HONEYPOT_TARPIT_RELEASE_SECONDS: ${HONEYPOT_TARPIT_RELEASE_SECONDS:-3600}
      # Read only to decide whether an address showing crash_active is still
      # being crashed. With the feature off the honeypots ignore the flag, and a
      # dashboard that did not know that would report CRASHED for addresses
      # nothing is crashing. The threshold comes along so the settings page can
      # describe the tier it belongs to.
      HONEYPOT_CRASH: ${HONEYPOT_CRASH:-1}
      HONEYPOT_CRASH_THRESHOLD: ${HONEYPOT_CRASH_THRESHOLD:-15}
      HONEYPOT_BAN_TTL: ${HONEYPOT_BAN_TTL:-604800}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      HONEYPOT_MAX_STORAGE_MB: ${HONEYPOT_MAX_STORAGE_MB:-4096}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_SYSLOG_HOST: ${ALERT_SYSLOG_HOST:-}
      # Informational only, so the settings page can describe the camera. The
      # SMTP credentials are deliberately not passed here -- only session-cam
      # needs them.
      CAM_ENABLED: ${CAM_ENABLED:-true}
      CAM_FORMAT: ${CAM_FORMAT:-mp4}
      CAM_MIN_SCORE: ${CAM_MIN_SCORE:-5}
      CAM_RETENTION_DAYS: ${CAM_RETENTION_DAYS:-14}
      # A link target for the operator's browser only -- this container is not
      # on elastic-internal and never connects to Kibana itself. Empty by
      # default, so no dead link appears unless the elastic profile is in use.
      KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-}
      # Sister appliance dashboard link. Reaches it over the operator's SSH tunnel
      # on 127.0.0.1, not over the container network. Empty by default.
      SISTER_DASHBOARD_URL: ${SISTER_DASHBOARD_URL:-}
      SISTER_DASHBOARD_NAME: ${SISTER_DASHBOARD_NAME:-}
    ports:
      # Loopback only. Reach it with:
      #   ssh -N -L 8443:127.0.0.1:8443 -p 2222 you@vps
      - "127.0.0.1:8443:8443"
    volumes:
      # A directory, not a file: bind-mounting a file that does not exist yet
      # makes Docker create a directory and setup.py then fails confusingly.
      - ./admin-dashboard/config:/app/config
      - ./admin-dashboard/admin-logs:/app/admin-logs
      - ./storage:/var/honeypot/storage:ro
      # The one writable sliver of the storage volume, and deliberately a
      # sibling of the read-only mount rather than a hole in it: the dashboard
      # drops rescan markers here and intel picks them up. Evidence stays
      # read-only to the operator UI, and the two containers still share no
      # network -- intel is on cam-egress alone, and putting them together
      # would hand the container with internet access a route to the honeypots.
      # bootstrap.sh creates it owned by the honeypot UID; without that Docker
      # makes it root-owned and the dashboard cannot write.
      - ./storage/requests:/var/honeypot/requests
      # Same database the elastic shipper uses. Optional; the dashboard shows
      # a note explaining how to add it when absent.
      - ./elastic/geoip:/geoip:ro
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    networks: [admin-internal, honeypot-internal]
    mem_limit: 384m
    pids_limit: 256
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL",
             "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8443/healthz',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  # NOT `internal: true`, despite that being the obvious choice here.
  #
  # Docker does not install DNAT rules for published ports on an internal
  # network, so every `ports:` entry below silently does nothing: the config
  # shows the binding, `NetworkSettings.Ports` shows null, and no honeypot is
  # reachable. An internal network gives isolation by making the bridge useless
  # in both directions, which is one direction too many for a honeypot.
  #
  # Egress is therefore blocked at the host firewall instead, by DOCKER-USER
  # rules that bootstrap.sh installs: replies to inbound connections and
  # container-to-container traffic are allowed, anything this subnet originates
  # towards the outside is dropped. Verify with `./deploy/smoke-test.sh`, which
  # asserts that ssh-honey and web cannot reach 1.1.1.1.
  #
  # enable_icc is stated EXPLICITLY on every network whose members must talk to
  # each other, so that inter-container communication never depends on whatever
  # the daemon's default happens to be. It costs one line and removes a class
  # of "it worked until the networks were recreated" surprises.
  #
  # It is not a fix for anything currently broken -- if containers cannot reach
  # each other, check for stale nftables rules first (deploy/clean-stale-nft.sh
  # and the Troubleshooting section of the README). That failure looks identical
  # from every normal diagnostic and is far more likely than an ICC problem.
  honeypot-internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.25.0.0/16
  admin-internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.26.0.0/16
  # The one network in the appliance with egress. session-cam is its only
  # member, and session-cam is on no other network -- so this grants the
  # ability to deliver clips without granting the honeypot a way out.
  #
  # No enable_icc here, deliberately. Its members -- session-cam, intel and
  # certbot -- exchange work through the storage volume and never open a socket
  # to one another, so inheriting the daemon's `icc: false` costs nothing and
  # removes a path between the containers that can reach the internet.
  cam-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
  # Elasticsearch, Kibana and the shipper only. No honeypot container is a
  # member, so nothing an attacker reaches can talk to the search stack.
  elastic-internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/16

  kibana-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"

  # llm-broker and ollama. No honeypot container is a member, so the fake shell
  # has no route to either -- it reaches the broker by writing a file, the same
  # way it reaches session-cam.
  #
  # enable_icc is true here, unlike cam-egress. The members of cam-egress never
  # open a socket to each other so it costs nothing to forbid it; these two do,
  # because the broker calls Ollama over HTTP. Stating it explicitly keeps that
  # from depending on whatever the daemon default happens to be.
  llm-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  redis-honeypot-data:
  redis-admin-data:
  ssh-host-key:
  # Downloaded models. Named, so `docker compose down` does not throw away
  # several gigabytes that then have to come back over the network.
  ollama-models:
  elasticsearch-data:
  # Account key and issued certificates. Losing this is not fatal -- certbot
  # re-registers and re-issues -- but it does burn Let's Encrypt rate limit.
  letsencrypt-data:
