# Main nginx config. Runs entirely as UID 1000: no master-as-root, no privileged
# ports. The container listens on 8080/8443 and the host maps 80/443 onto them.

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Non-root needs writable temp paths outside /var.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Do not advertise the real nginx version; the fake identity claims Apache.
    server_tokens off;

    # log_format is only legal in the http context. Defining it inside a server
    # block makes nginx refuse to start.
    log_format honeypot '$http_cf_connecting_ip - $remote_addr [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_cf_ipcountry" "$http_user_agent"';
    access_log /dev/stdout honeypot;

    # Tarpit responses must never be buffered or compressed, or the drip effect
    # is lost and nginx holds the bytes instead of the attacker.
    gzip off;
    fastcgi_buffering off;
    proxy_buffering off;

    # PHP-FPM runs in this same container on loopback.
    upstream php-fpm {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    # Long timeouts: a tarpit deliberately holds a request open for many minutes.
    fastcgi_read_timeout 1200s;
    fastcgi_send_timeout 1200s;

    include /etc/nginx/conf.d/*.conf;
}
