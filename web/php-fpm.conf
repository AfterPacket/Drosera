; PHP-FPM pool for the honeypot. Installed to pool.d/, so it must contain only
; a pool section -- global directives live in php-fpm.conf proper.
;
; Sizing note: a tarpit pins one worker for as long as it holds the attacker's
; connection. max_children must therefore comfortably exceed
; TARPIT_MAX_CONCURRENT (default 24), or tarpits would starve the site of
; capacity and the honeypot would take itself offline. Tarpitted workers are
; asleep, so memory is the constraint, not CPU: 64 x ~24MB fits the 512m limit.

[honeypot]
user = honeypot
group = honeypot
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = static
pm.max_children = 64
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = no

; Tarpits legitimately run for many minutes; the engine enforces its own
; TARPIT_MAX_SECONDS deadline, so FPM must not pre-empt it.
request_terminate_timeout = 0

; Uploads land in a dedicated directory and are unlinked immediately after
; hashing. Confining them keeps attacker bytes off every other path.
php_admin_value[upload_tmp_dir] = /var/honeypot/storage/upload-tmp
php_admin_value[sys_temp_dir] = /var/honeypot/storage/upload-tmp

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 0
php_admin_value[max_input_time] = 30
php_admin_value[post_max_size] = 20M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /dev/stderr
php_admin_value[allow_url_fopen] = Off
php_admin_value[allow_url_include] = Off

; Hard kill switch for real execution. fsockopen and stream_socket_client stay
; enabled ONLY because the inline Redis client needs them; both are called with
; environment-derived host and port, never with request data.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,proc_close,proc_nice,proc_terminate,popen,pcntl_exec,pcntl_fork,dl,putenv,symlink,link,chgrp,chown,posix_kill,posix_setuid,posix_setgid,apache_child_terminate,apache_setenv,escapeshellarg,escapeshellcmd,show_source,highlight_file
