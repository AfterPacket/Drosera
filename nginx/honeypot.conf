# Drosera site config.
#
# ZERO-TRUST ROUTING:
#   - storage/ and lib/ are never served.
#   - index.php sits OUTSIDE the document root and is reachable only through the
#     two explicit SCRIPT_FILENAME mappings below.
#   - Everything unmatched falls through to catch_scanner_paths.php.

# ---- Cloudflare real-IP -----------------------------------------------------
# Keep in sync with https://www.cloudflare.com/ips/ as routine maintenance.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    # Ubuntu 22.04 ships nginx 1.18, where http2 is a listen parameter.
    # The separate `http2 on;` directive only exists from 1.25.1.
    listen 8443 ssl http2 default_server;
    listen [::]:8443 ssl http2 default_server;

    server_name _;
    root /var/www/html/public_site;

    # Paths written by the entrypoint: the Cloudflare Origin Certificate when
    # present, otherwise a generated self-signed cert so nginx always starts.
    include /tmp/nginx/ssl.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The fake identity claims Apache; keep the story consistent.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- never served -------------------------------------------------------
    location ^~ /storage { deny all; return 404; }
    location ^~ /lib     { deny all; return 404; }
    location ~ /\.(?!well-known) {
        # Dotfile probes are scanner behaviour: hand them to the trap handler
        # rather than letting nginx answer 403 and reveal a real server.
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site/catch_scanner_paths.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ---- webshell entry point (realistic WordPress path) --------------------
    location = /wp-admin/admin-ajax.php {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ---- crawler trap: endless procedurally generated blog ------------------
    location /blog/ {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ---- WordPress trap endpoints -------------------------------------------
    location ~ ^/(wp-login\.php|xmlrpc\.php|contact-form-handler\.php)$ {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site$fastcgi_script_name;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # ---- public static site --------------------------------------------------
    # index.html is a template: the company name and the honeytoken credentials
    # in it come from this deployment's persona. home.php fills it in, and a
    # direct request for /index.html goes to the trap rather than serving the
    # raw template with its placeholders showing. A real WordPress site 404s
    # on /index.html too, so the trap's 404 is the consistent answer.
    location = / {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site/home.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }
    location = /index.html { try_files /nonexistent @trap; }
    location = /robots.txt { try_files $uri =404; access_log off; }

    # Generated so its URLs carry the real serving host. A sitemap advertising
    # a different hostname is an obvious tell and crawlers would skip it.
    location = /sitemap.xml {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site/sitemap.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        try_files $uri @trap;
        expires 7d;
        access_log off;
    }
    location ~* \.html$ { try_files $uri @trap; }

    # ---- everything else is a scanner ---------------------------------------
    # Serve a genuine static file if one exists, otherwise it is a probe.
    location / {
        try_files $uri @trap;
    }

    location @trap {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site/catch_scanner_paths.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # Any other .php request is a probe, not a real page.
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public_site/catch_scanner_paths.php;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }
}
